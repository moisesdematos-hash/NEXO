<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logos/nexo-logo-master.jpg" />
    <link rel="shortcut icon" href="/logos/nexo-logo-master.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="description" content="NEXO — Tudo o que precisas. Num só lugar. Hub digital para organizar tarefas, agenda, listas, objectivos, aprendizagem e família." />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NEXO" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/logos/nexo-logo-master.jpg" />
    <title>NEXO — Tudo o que precisas. Num só lugar.</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('nexo-theme');
          var isDark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          if (localStorage.getItem('nexo-simple-mode') === 'true') {
            document.documentElement.classList.add('simple-mode');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
